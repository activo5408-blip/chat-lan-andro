name: Build Chat LAN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'chatlan-android.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project and locate root
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          unzip -q chatlan-android.zip -d extracted
          echo "Project files:"
          find extracted -maxdepth 4 -type f | sort | head -150

          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in chatlan-android.zip"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project root: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          find extracted -type f -name '*.apk' -print
          APK="$(find extracted -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Build completed but no APK was found."
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/Chat-LAN-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatlan-debug-apk
          path: output/Chat-LAN-debug.apk
          if-no-files-found: error
          retention-days: 14
